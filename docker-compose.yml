version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: infocom_db
    environment:
      POSTGRES_DB: infocom_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: infocom_backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://postgres:postgres_password@db:5432/infocom_db
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: infocom_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
